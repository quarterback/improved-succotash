<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Occupant</title>
<meta http-equiv="refresh" content="0; url=index.html" />
<link rel="canonical" href="index.html" />
<link rel="icon" type="image/svg+xml" href="logo.svg" />
<style>
  :root { --paper:#ecd56c; --ink:#1a1612; --ink-mute:#6b6049; --accent:#8a3a1f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--paper); color:var(--ink);
    font-family:'Newsreader', Georgia, serif;
    display:grid; place-items:center; min-height:100vh; padding:2rem;
    -webkit-font-smoothing:antialiased;
  }
  .msg p {
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--ink-mute); text-align:center;
  }
  .msg a { color:var(--accent); }
</style>
</head>
<body>

<div class="oi-acquisition-banner" role="note">
  <p><strong>Occupant Indices</strong> has been acquired by <strong>Opinionated Intelligence</strong>. More details to come soon.</p>
</div>
<style>
.oi-acquisition-banner {
  background: #1d2a44;
  color: #f4f1e8;
  font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 13px;
  letter-spacing: 0.01em;
  text-align: center;
  padding: 10px 16px;
  border-bottom: 2px solid #d97757;
}
.oi-acquisition-banner p { margin: 0; }
.oi-acquisition-banner strong { font-weight: 600; }
</style>

  <div class="msg"><p>Redirecting to <a href="index.html">Occupant</a>&hellip;</p></div>
</body>
</html>
